name: update prices

on:
  schedule:
    - cron: "30 22 * * *"  # 05:30 Bangkok: new prices start at 05:00
    - cron: "0 12 * * *"   # 19:00 Bangkok: tomorrow's price is usually announced in the evening
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python -m pytest -q scraper/tests
      - name: Fetch prices
        working-directory: scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python update.py
      - name: Commit data
        if: always()   # keep what one brand returned even if the other failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Bangkok date +'%Y-%m-%d %H:%M')"
          git push
